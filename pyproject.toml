[project]
name = "lead-signal-agent"
version = "0.2.0"
description = "AI agent that finds public conversations where people look for a product like yours and scores them against your ideal customer profile."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Gurpreet Kaur" }, { name = "Andrii Kundik" }]
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2"]
sheets = ["gspread>=6", "google-auth>=2"]

[project.scripts]
lead-agent = "lead_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
